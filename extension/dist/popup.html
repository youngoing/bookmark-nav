<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>bookmark-nav</title>
    <style>
      :root{color-scheme:light;--ink:#172033;--muted:#7d8799;--line:#e5e9ef;--accent:#536dfe;--soft:#f3f5ff;--danger:#c94f5f}
      *{box-sizing:border-box}body{margin:0;width:340px;min-height:310px;background:#f7f8fa;color:var(--ink);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif}
      button,input{font:inherit}.shell{padding:18px}.header{display:flex;align-items:center;gap:9px;margin-bottom:20px}.mark{width:28px;height:28px;border-radius:7px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:17px}.header strong{font-size:16px}.header button{margin-left:auto;border:0;background:transparent;color:var(--muted);padding:6px;cursor:pointer}.eyebrow{margin:0 0 5px;color:#9aa4b3;font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase}h1{margin:0 0 6px;font-size:20px}p{margin:0;color:var(--muted);font-size:11px;line-height:1.55}.panel{display:flex;flex-direction:column;gap:13px}label{display:flex;flex-direction:column;gap:6px;color:#657083;font-size:10px;font-weight:700}input{width:100%;height:39px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);padding:0 10px;outline:0}input:focus{border-color:#91a1ff;box-shadow:0 0 0 3px #536dfe14}.primary,.secondary{height:39px;border-radius:6px;border:0;font-weight:700;cursor:pointer}.primary{background:var(--accent);color:#fff}.primary:disabled{opacity:.6;cursor:wait}.secondary{background:#eef0f4;color:#5f697a}.page-preview{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:center;padding:12px;background:#fff;border:1px solid var(--line);border-radius:7px}.favicon{width:34px;height:34px;border-radius:7px;background:var(--soft);object-fit:contain;padding:7px}.page-copy{min-width:0}.page-copy strong,.page-copy span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.page-copy strong{font-size:12px}.page-copy span{margin-top:3px;color:var(--muted);font-size:9px}.status{min-height:17px;color:var(--muted);font-size:11px;text-align:center}.status.error{color:var(--danger)}.success{padding:12px;border:1px solid #bfe5d5;border-radius:7px;background:#effaf5;color:#227a59;text-align:center;font-weight:700}.hidden{display:none!important}.connection{display:flex;align-items:center;gap:6px;color:#2a8b68;font-size:10px}.connection:before{content:"";width:6px;height:6px;border-radius:50%;background:#2a9d72}
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <span class="mark">⌑</span><strong>bookmark-nav</strong>
        <button id="settings" class="hidden" type="button" title="重新配置">设置</button>
      </header>
      <section id="setup" class="panel">
        <div><p class="eyebrow">连接工作区</p><h1>导入 API Key</h1><p>在网页的账号设置中创建扩展密钥，然后粘贴到这里。</p></div>
        <label>服务地址<input id="endpoint" type="url" value="https://youngoing.cn" placeholder="https://youngoing.cn"></label>
        <label>API Key<input id="apiKey" type="password" autocomplete="off" placeholder="bmn_..."></label>
        <button id="connect" class="primary" type="button">验证并连接</button>
        <div id="setupStatus" class="status" role="status"></div>
      </section>
      <section id="capture" class="panel hidden">
        <div class="connection">已连接工作区</div>
        <div class="page-preview"><img id="favicon" class="favicon" alt=""><div class="page-copy"><strong id="pageTitle"></strong><span id="pageUrl"></span></div></div>
        <label>书签名称<input id="title" maxlength="200"></label>
        <button id="save" class="primary" type="button">保存当前页面</button>
        <div id="captureStatus" class="status" role="status"></div>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
