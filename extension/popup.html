<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>bookmark-nav</title>
    <style>
      :root{color-scheme:light;--ink:#172033;--muted:#7d8799;--line:#e5e9ef;--accent:#536dfe;--soft:#f3f5ff;--danger:#c94f5f}
      *{box-sizing:border-box}body{margin:0;width:380px;min-height:310px;background:#f7f8fa;color:var(--ink);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif}
      button,input,textarea,select{font:inherit}.shell{padding:18px}.header{display:flex;align-items:center;gap:9px;margin-bottom:18px}.mark{width:28px;height:28px;border-radius:7px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:17px}.header strong{font-size:16px}.header button{margin-left:auto;border:0;background:transparent;color:var(--muted);padding:6px;cursor:pointer}.eyebrow{margin:0 0 5px;color:#9aa4b3;font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase}h1{margin:0 0 6px;font-size:20px}p{margin:0;color:var(--muted);font-size:11px;line-height:1.55}.panel{display:flex;flex-direction:column;gap:13px}label,.field{display:flex;flex-direction:column;gap:6px;color:#657083;font-size:10px;font-weight:700}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);padding:0 10px;outline:0}input,select{height:39px}textarea{min-height:68px;padding-top:9px;line-height:1.45;resize:vertical}input:focus,textarea:focus,select:focus{border-color:#91a1ff;box-shadow:0 0 0 3px #536dfe14}.primary,.secondary{height:39px;border-radius:6px;border:0;font-weight:700;cursor:pointer}.primary{background:var(--accent);color:#fff}.primary:disabled{opacity:.6;cursor:wait}.secondary{background:#eef0f4;color:#5f697a}.page-preview{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:center;padding:11px;background:#fff;border:1px solid var(--line);border-radius:7px}.favicon{width:34px;height:34px;border-radius:7px;background:var(--soft);object-fit:contain;padding:7px}.page-copy{min-width:0}.page-copy strong,.page-copy span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.page-copy strong{font-size:12px}.page-copy span{margin-top:3px;color:var(--muted);font-size:9px}.field-heading,.tag-heading{display:flex;align-items:center;justify-content:space-between}.field-heading button,.tag-heading button{height:22px;padding:0 6px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--accent);font-size:10px;font-weight:600;cursor:pointer}.field-heading button:hover,.tag-heading button:hover{background:var(--soft)}.tag-heading span:last-child{color:#a1a9b6;font-size:9px;font-weight:500}.tag-list{display:flex;flex-wrap:wrap;gap:6px;min-height:31px;max-height:96px;overflow:auto;padding:1px}.tag-option{height:28px;display:inline-flex;align-items:center;gap:6px;padding:0 9px;border:1px solid var(--line);border-radius:5px;background:#fff;color:#667184;font-size:10px;cursor:pointer}.tag-option.child{margin-left:9px}.tag-option:hover{border-color:var(--tag-color);color:var(--tag-color)}.tag-option.selected{border-color:color-mix(in srgb,var(--tag-color) 55%,var(--line));background:color-mix(in srgb,var(--tag-color) 10%,#fff);color:var(--tag-color);font-weight:700}.tag-dot{width:7px;height:7px;border-radius:50%;background:var(--tag-color)}.tag-message{width:100%;padding:8px 1px;color:var(--muted);font-size:10px;font-weight:500}.quick-create{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid #dfe4ff;border-radius:7px;background:#fbfbff}.quick-create-row{display:grid;grid-template-columns:minmax(0,1fr) 78px;gap:7px}.quick-create input,.quick-create select{height:32px;font-size:11px}.quick-create-actions{display:flex;justify-content:flex-end;gap:6px}.quick-create-actions button{height:28px;padding:0 9px;border-radius:5px;font-size:10px;font-weight:600;cursor:pointer}.quick-create-actions .primary{background:var(--accent);color:#fff}.quick-create-actions .secondary{background:#eef0f4;color:#5f697a}.manage-links{display:flex;justify-content:center;gap:8px;color:#8c96a6;font-size:10px}.manage-links a{color:var(--accent);text-decoration:none}.status{min-height:17px;color:var(--muted);font-size:11px;text-align:center}.status.error{color:var(--danger)}.success{padding:10px;border:1px solid #bfe5d5;border-radius:7px;background:#effaf5;color:#227a59;text-align:center;font-weight:700}.hidden{display:none!important}.connection{display:flex;align-items:center;gap:6px;color:#2a8b68;font-size:10px}.connection:before{content:"";width:6px;height:6px;border-radius:50%;background:#2a9d72}
      .mark{object-fit:cover;display:block}
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <img class="mark" src="icon.svg" alt=""><strong>bookmark-nav</strong>
        <button id="settings" class="hidden" type="button" title="重新配置">设置</button>
      </header>
      <section id="setup" class="panel">
        <div><p class="eyebrow">连接工作区</p><h1>导入 API Key</h1><p>在网页的账号设置中创建扩展密钥，然后粘贴到这里。</p></div>
        <label>服务地址<input id="endpoint" type="url" value="https://youngoing.cn" placeholder="https://youngoing.cn"></label>
        <label>API Key<input id="apiKey" type="password" autocomplete="off" placeholder="bmn_..."></label>
        <button id="connect" class="primary" type="button">验证并连接</button>
        <div id="setupStatus" class="status" role="status"></div>
      </section>
      <section id="capture" class="panel hidden">
        <div class="connection">已连接工作区</div>
        <div class="page-preview"><img id="favicon" class="favicon" alt=""><div class="page-copy"><strong id="pageTitle"></strong><span id="pageUrl"></span></div></div>
        <label>书签名称<input id="title" maxlength="200"></label>
        <label>链接<input id="url" type="url" placeholder="https://example.com"></label>
        <label>描述<textarea id="description" maxlength="1000" placeholder="补充这条书签的用途或重点"></textarea></label>
        <div class="field"><div class="field-heading"><span>目录</span><button id="newFolder" type="button">+ 新建</button></div><select id="folderId" aria-label="选择目录"><option value="">继承网站或未分类</option></select><div id="folderCreator" class="quick-create hidden"><div class="quick-create-row"><input id="newFolderName" maxlength="40" placeholder="目录名称"><input id="newFolderIcon" maxlength="8" value="📁" aria-label="目录图标"></div><div class="quick-create-actions"><button id="cancelFolder" class="secondary" type="button">取消</button><button id="createFolder" class="primary" type="button">创建目录</button></div><div id="folderStatus" class="status" role="status"></div></div></div>
        <div class="field"><div class="tag-heading"><span>标签</span><span id="tagCount">0 个已选</span><button id="newTag" type="button">+ 新建</button></div><div id="tagList" class="tag-list" aria-label="选择标签"></div><div id="tagCreator" class="quick-create hidden"><input id="newTagName" maxlength="30" placeholder="标签名称"><div class="quick-create-row"><input id="newTagColor" type="color" value="#536dfe" aria-label="标签颜色"><select id="newTagIcon" aria-label="标签图标"><option value="Tag">标签</option><option value="Code2">代码</option><option value="BookOpen">阅读</option><option value="BriefcaseBusiness">工作</option><option value="Palette">设计</option><option value="Globe2">网站</option><option value="Heart">收藏</option><option value="Zap">灵感</option></select></div><select id="newTagParent" aria-label="父标签"><option value="">顶级标签</option></select><div class="quick-create-actions"><button id="cancelTag" class="secondary" type="button">取消</button><button id="createTag" class="primary" type="button">创建标签</button></div><div id="tagStatus" class="status" role="status"></div></div></div>
        <button id="save" class="primary" type="button">保存当前页面</button>
        <div class="manage-links"><span>需要整理更多内容？</span><a id="manageFolders" href="#">管理目录</a><a id="manageTags" href="#">管理标签</a></div>
        <div id="captureStatus" class="status" role="status"></div>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
