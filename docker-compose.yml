services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3000/auth/google/callback}
      FEISHU_LOGIN_ENABLED: ${FEISHU_LOGIN_ENABLED:-false}
      FEISHU_CLIENT_ID: ${FEISHU_CLIENT_ID:-}
      FEISHU_CLIENT_SECRET: ${FEISHU_CLIENT_SECRET:-}
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: bookmark_nav
      MONGODB_APP_NAME: bookmark-nav
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:4000
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
  mongo:
    image: mongo:7
    volumes:
      - bookmark_nav_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  bookmark_nav_data:
