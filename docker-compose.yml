services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production}
      API_TOKEN: ${API_TOKEN:-demo-api-token}
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: bookmark_nav
      MONGODB_APP_NAME: bookmark-nav
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:4000
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
  mongo:
    image: mongo:7
    volumes:
      - bookmark_nav_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  bookmark_nav_data:
